name: generate-builds
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The VR fork's libultraship includes <d3d11.h> and links OpenVR unconditionally,
  # so it can only be built on Windows. Linux/macOS jobs were removed, and soh.o2r
  # is now generated on the Windows runner itself.
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Install dependencies
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      # The libultraship-vr submodule only ships openvr_api.dll; the headers and
      # openvr_api.lib are missing, so fetch them from Valve's OpenVR SDK.
      - name: Fetch OpenVR SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ValveSoftware/openvr/archive/refs/tags/v2.5.1.zip" -OutFile openvr.zip
          Expand-Archive -Path openvr.zip -DestinationPath openvr-tmp
          $dst = "libultraship/external/openvr"
          New-Item -ItemType Directory -Force -Path "$dst/headers","$dst/lib/win64","$dst/bin/win64" | Out-Null
          Copy-Item "openvr-tmp/openvr-2.5.1/headers/*" "$dst/headers" -Recurse -Force
          Copy-Item "openvr-tmp/openvr-2.5.1/lib/win64/openvr_api.lib" "$dst/lib/win64" -Force
          Copy-Item "openvr-tmp/openvr-2.5.1/bin/win64/openvr_api.dll" "$dst/bin/win64" -Force
          Get-ChildItem $dst -Recurse -File | Select-Object -First 20 -ExpandProperty FullName
      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          max-size: "2G"
          evict-old-files: job
          save: ${{ github.ref_name == github.event.repository.default_branch }}
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}
            ${{ runner.os }}-ccache
      - name: Restore Cached VCPKG folder
        id: restore-cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ github.ref }}-
            ${{ runner.os }}-vcpkg-
          path: vcpkg
      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build SoH
        env:
          VCPKG_ROOT: ${{github.workspace}}/vcpkg
        run: |
          set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
          cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_REMOTE_CONTROL=1
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Generate soh.o2r on this runner, then place it where the install step expects it
          cmake --build build-windows --config Release --target GenerateSohOtr
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path build-windows/soh | Out-Null
          if (Test-Path soh.o2r) {
            Copy-Item soh.o2r build-windows/soh/soh.o2r -Force
          } else {
            Get-ChildItem -Recurse -Filter soh.o2r -File | Select-Object -ExpandProperty FullName
            throw "soh.o2r was not generated at the repo root"
          }

          cmake --build build-windows --config Release --parallel 10
          if ($LASTEXITCODE -ne 0) { exit 1 }

          (cd build-windows && cpack)
          cd ..
          mv _packages/*.zip _packages/soh-windows.zip
      - name: Unzip package
        run: Expand-Archive -Path _packages/soh-windows.zip -DestinationPath soh-windows
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: soh-windows
          path: soh-windows
      - name: Save Cache VCPKG folder
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
          path: vcpkg
