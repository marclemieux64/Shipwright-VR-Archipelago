name: Generate Builds

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-soh-o2r:
    name: Generate shared O2R assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          xargs -a .github/workflows/apt-deps.txt sudo apt-get install -y
          sudo apt-get install -y libzip-dev libtinyxml2-dev zipcmp zipmerge ziptool ninja-build

      - name: Configure CMake
        run: cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Generate O2R asset
        run: cmake --build build-cmake --target GenerateSohOtr --parallel 3

      - name: Verify generated asset
        run: test -f soh/soh.o2r

      - name: Upload O2R asset
        uses: actions/upload-artifact@v4
        with:
          name: soh-o2r
          path: soh/soh.o2r
          if-no-files-found: error

  build-windows:
    name: Build Windows (MSVC + Ninja)
    runs-on: windows-latest
    needs: generate-soh-o2r
    steps:
      - name: Install dependencies
        shell: powershell
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download O2R asset
        uses: actions/download-artifact@v4
        with:
          name: soh-o2r
          path: soh

      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          max-size: "2G"
          evict-old-files: job
          save: ${{ github.ref_name == github.event.repository.default_branch }}
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}
            ${{ runner.os }}-ccache

      - name: Restore Cached VCPKG folder
        id: restore-cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ github.ref }}-
            ${{ runner.os }}-vcpkg-
          path: vcpkg

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build SoH
        shell: powershell
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"

          # 1. Configure CMake project
          cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_REMOTE_CONTROL=1
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # 2. Compile full application
          cmake --build build-windows --config Release --parallel 10
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # 3. Package binaries
          Set-Location build-windows
          cpack
          Set-Location ..

          New-Item -ItemType Directory -Force -Path _packages | Out-Null
          if (Test-Path "_packages/*.zip") {
              Move-Item -Path "_packages/*.zip" -Destination "_packages/soh-windows.zip" -Force
          }

      - name: Unzip package
        shell: powershell
        run: |
          if (Test-Path "_packages/soh-windows.zip") {
              Expand-Archive -Path "_packages/soh-windows.zip" -DestinationPath soh-windows -Force
          } else {
              Write-Error "Package _packages/soh-windows.zip was not found!"
              exit 1
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: soh-windows
          path: soh-windows

      - name: Save Cache VCPKG folder
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
          path: vcpkg
